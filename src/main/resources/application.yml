server:
  port: ${APP_PORT:8082}
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: jxj-ai-agent

  # Spring Boot 4.x 下 spring-dotenv 不再生效，改用原生 config data 导入 .env；
  # optional 表示文件缺失时不阻断启动；相对路径基于进程工作目录（项目根目录）。
  # 注意：导入的属性优先级低于 OS 环境变量(systemEnvironment)。
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/jxj?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 业务表（jxb_*/cms_*/ums_*）只读直查 + ai_* 表读写
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

  # 文件上传（管理台知识库）。Spring Boot 默认单文件上限只有 1MB，
  # 一份带图的国家标准 PDF 就 1~2MB，不放开的话上传直接 413。
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_MB:50}MB
      max-request-size: ${UPLOAD_MAX_REQUEST_MB:50}MB
      # 小于这个大小的文件先写内存，超过才落磁盘临时文件
      file-size-threshold: 2MB

  # 主聊天模型 = MIMO（OpenAI 兼容）
  ai:
    model:
      # 向量模型只留 DashScope 一个。Ollama starter 默认也会注册 EmbeddingModel，
      # 不锁定的话容器里会有两个 EmbeddingModel Bean，M8 注入时直接歧义。
      # 注意不要设 spring.ai.model.chat——chat 是单选属性，一设就会把另一个聊天模型关掉，
      # 而我们要同时保留 MIMO（主）和 Ollama（小模型）。
      embedding: openai
    openai:
      base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
      api-key: ${MIMO_API_KEY:}
      chat:
        options:
          model: ${MIMO_MODEL:mimo-v2.5}
      # Embedding = DashScope text-embedding-v4（覆盖 base-url / key）
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${DASHSCOPE_API_KEY:}
        options:
          model: text-embedding-v4

    # 第 2 层意图识别的小模型：本地 Ollama（走原生客户端，base-url 不要带 /v1）
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:7b}
          # 分类任务要的是稳定复现，不是文采
          temperature: 0.0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 刻意不开 StdOutImpl：它会把每条 SQL 的完整结果集打到控制台，
    # 启动时载入 3869 条区划 + 438 条字典就是几千行刷屏。
    # 排查 SQL 时改用 logging.level.com.jixiejia.agent.persistence.mapper.jxj: debug
  global-config:
    db-config:
      # 刻意不配 logic-delete-field：jxj 业务表虽然也有 del_flag，但语义与 ai_* 表不同
      #   - ai_* 表：'0'=存在 '2'=删除（V1 脚本约定）
      #   - jxb_chuzu/jxb_qiuzu 等活动行 del_flag 是空串或 NULL，被删行才是 '1'
      #     若在此全局开启，MyBatis-Plus 会补 `del_flag='0'`，14 条在租记录会被整体过滤掉。
      # 因此改为：ai_* 实体各自标注 @TableLogic，业务表一律在 BizFilters 里显式写明过滤条件。
      logic-delete-value: 2
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

# 鉴权：Agent 必须登录后才能使用；管理员与普通用户分角色
ai:
  auth:
    # 登录令牌有效期（小时），默认 7 天
    token-ttl-hours: ${AI_TOKEN_TTL_HOURS:168}
    # 初始管理员：仅当库里一个 ADMIN 都没有时才会创建
    init-admin-username: ${AI_INIT_ADMIN_USERNAME:admin}
    # 留空则随机生成并打印到启动日志，避免把默认口令写死在配置里
    init-admin-password: ${AI_INIT_ADMIN_PASSWORD:}

# 会话与记忆
ai-session:
  title: "你好，我是机械家AI助手"
  describe: "机械家的智能客服/导购助手，可以帮你找设备、查出租求租、查需求询价、看行业资讯，也可以帮你在平台发布出租/求租。"
  examples:
    - "有没有二手的挖掘机？"
    - "附近有挖掘机出租吗？"
    - "在平台租设备的流程和押金怎么算？"
    - "现在有哪些设备需求或询价？"
    - "帮我发布一台出租"

# 路由链（7 步短路）：身份 → 命令 → 会话粘性 → 指代消解 → 三层意图 → Agent 匹配 → 审计
routing:
  enabled: ${AI_INTENT_ROUTING_ENABLED:true}

  # 会话粘性：模糊追问沿用上一轮 Agent，避免每轮重新分类
  sticky:
    enabled: true
    ttl-minutes: ${AI_STICKY_TTL_MINUTES:30}
    # 注：这里刻意没有"切换置信度阈值"这类开关。
    # 换不换话题由第 1 层关键词扫描决定（命中不同意图即切换，见 KeywordWeightClassifier），
    # 阈值就是 routing.keyword.high-weight，再设一个数值只会变成两个真相来源。

  # 第 1 层关键词加权分类
  keyword:
    high-weight: 0.9
    mid-weight: 0.7

  # 第 4 层指代消解（用小模型改写"这个/那台"这类说法）
  reference:
    enabled: true

  # 第 2 层小模型的采信阈值与超时。小模型常对错误答案也给高分，所以门槛设得比大模型高
  small-model:
    min-confidence: 0.6
    # 本地模型冷启动要把几 GB 权重读进内存，超时给得太紧会让首个请求静默降级到兜底
    timeout-ms: ${AI_SMALL_MODEL_TIMEOUT_MS:30000}

  # 第 3 层大模型的采信阈值与超时。它是最后一层，再拦就只能 UNKNOWN，所以门槛放低
  llm:
    min-confidence: 0.4
    # 主模型是推理型，先"想"一段再输出，超时要比普通对话宽
    timeout-ms: ${AI_LLM_TIMEOUT_MS:45000}

  # 置 false 可关闭后两层模型，只跑关键词分类（离线回归 / 降本时用）
  model-layers-enabled: ${AI_MODEL_LAYERS_ENABLED:true}

  # 跨域综合：一句话命中多个领域时，各域 Agent 并行跑完再汇总
  cross-domain:
    # 单轮最多并行跑几个域。每个域是一次完整的 Agent 调用（模型 + 工具循环），
    # 上限直接决定这条路径的成本，所以宁小勿大
    max-agents: ${AI_CROSS_DOMAIN_MAX_AGENTS:3}
    # 综合那一步的超时。它要读完各域结果再写一段完整回答，比分类耗时得多，给足
    synthesis-timeout-ms: ${AI_CROSS_DOMAIN_SYNTHESIS_TIMEOUT_MS:90000}

# RAG：知识入库、混合召回、证据闸
rag:
  embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
  embedding-model: text-embedding-v4

  # 切片：按句子攒块，不是按固定字数硬切
  chunk:
    # 单块目标字符数。太小会把一个完整说法切散，太大检索粒度粗、喂给模型也浪费
    max-chars: ${RAG_CHUNK_MAX_CHARS:400}
    # 相邻块重叠，避免答案正好跨在两块中间被切断
    overlap-chars: ${RAG_CHUNK_OVERLAP_CHARS:60}

  # 混合召回：关键词(BM25) + 语义(KNN)，用 RRF 融合
  retrieval:
    # 最终喂给模型的证据条数
    top-k: ${RAG_TOP_K:5}
    # 送进精排的候选条数。要明显大于 top-k：检索的排序和精排的排序不是一回事，
    # 真正的答案未必在检索的前 5 里（实测一张 32 行的危险表在向量那路排第 2，
    # 却因只走单路被 RRF 挤出前 5，精排根本没见到它）。召回放宽、精排收紧。
    rerank-candidates: ${RAG_RERANK_CANDIDATES:20}
    # 每路各召回多少条候选，融合后再截断
    candidates: ${RAG_CANDIDATES:20}
    # KNN 考察的候选向量数，必须 >= candidates
    num-candidates: ${RAG_NUM_CANDIDATES:100}
    # 同章节回填：命中块所在章节的前后邻块也一起喂给模型。
    # 解决"条款被切成几块、模型只看到半截"——这是父子块（small-to-big）的轻量形态：
    # 不做严格的父块存储，用 section_path 这个天然归属把兄弟块聚起来。
    sibling-expand: ${RAG_SIBLING_EXPAND:true}

  # 证据闸：资料不够就不让模型开口
  evidence-gate:
    enabled: ${RAG_EVIDENCE_GATE_ENABLED:true}
    # 主判据是下面 rerank-score。这个向量相似度门槛只在**精排不可用时**兜底——
    # 实测它分不开"能答"和"不能答"（两类分数区间几乎完全重叠），
    # 所以不要指望调它能解决问题，它只是保证精排挂了也不至于全放行。
    min-retrieval-score: ${RAG_MIN_RETRIEVAL_SCORE:0.6}
    # 精排分门槛。由 RetrievalEvalTest 在标注集上校准：
    # 24 条有答案的样本中位 0.837，10 条无答案的最高 0.190。
    # 取 0.19 时无答案的全部被拦下（漏放 0），代价是 13% 能答的问题被误拦（转人工）。
    # 这是偏保守的刻意取舍——误拦只是多转一次人工，漏放是直接给出编造的答案。
    min-rerank-score: ${RAG_MIN_RERANK_SCORE:0.19}

  # 精排（rerank）：交叉编码器给"问题+资料"成对打分，是证据闸的主判据
  rerank:
    enabled: ${RAG_RERANK_ENABLED:true}
    model: ${RAG_RERANK_MODEL:gte-rerank-v2}
    # 走 DashScope 原生接口（不是 embedding 那个 compatible-mode 前缀），复用同一个 key
    base-url: ${RAG_RERANK_BASE_URL:https://dashscope.aliyuncs.com}
    api-key: ${DASHSCOPE_API_KEY:}
    max-documents: ${RAG_RERANK_MAX_DOCUMENTS:20}

  # 生成后自评：答案有没有超出资料。用本地小模型，判不出来时放行
  self-eval:
    enabled: ${RAG_SELF_EVAL_ENABLED:true}

  # 文档解析（管理台上传 PDF/Word/图片）
  parse:
    # LiteParse CLI 命令名。Windows 上 npm 全局包装的是 lit.cmd，ProcessBuilder
    # 找不到时会自动用 cmd /c 兜一层，一般不用改这里。
    lit-command: ${RAG_LIT_COMMAND:lit}
    lit-timeout-seconds: ${RAG_LIT_TIMEOUT_SECONDS:180}

    # 扫描页 OCR：走多模态大模型，按量计费
    ocr:
      # 文本覆盖率低于这个值就认为"这页没有文本层"，送去 OCR。
      # 实测：文本完好的 PDF 是 0.25，扫描件是 0.008~0.08。
      # 注意不要用 LiteParse 的 needsOcr 布尔值来分流——它会被"页面里有图"点亮。
      coverage-threshold: ${RAG_OCR_COVERAGE_THRESHOLD:0.02}
      # 单次上传最多 OCR 多少页。多模态按量计费，必须有上限兜住最坏情况
      max-pages: ${RAG_OCR_MAX_PAGES:50}
      # OCR 并发度。各页互相独立，串行纯属浪费等待时间（实测 21 页串行近 6 分钟）
      concurrency: ${RAG_OCR_CONCURRENCY:4}
      # 截图 DPI。太高会让图片 token 暴涨
      dpi: ${RAG_OCR_DPI:200}
      model: ${RAG_OCR_MODEL:qwen-vl-max}
      base-url: ${RAG_OCR_BASE_URL:https://dashscope.aliyuncs.com}
      api-key: ${DASHSCOPE_API_KEY:}

# 观测与成本
langfuse:
  host: ${LANGFUSE_HOST:http://localhost:3000}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  enabled: ${LANGFUSE_ENABLED:false}

logging:
  level:
    root: info
    com.jixiejia.agent: debug
    # Mapper 包单独压到 info：MyBatis 的 SQL 日志挂在 mapper 接口的 DEBUG 级别上，
    # 不覆盖的话启动阶段光是工具注册的增删改查就会刷几百行。
    # 排查 SQL 时把下面这行临时改成 debug。
    com.jixiejia.agent.persistence.mapper: info
    org.bsc.langgraph4j: info
