<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机械家 AI 助手</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --panel: #ffffff;
            --border: #e3e5e9;
            --text: #1f2329;
            --muted: #8a9099;
            --brand: #d97706;
            --brand-soft: #fef3e2;
            --user-bubble: #d97706;
            --bot-bubble: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* ---------- 登录 ---------- */
        #login {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 340px;
            padding: 32px;
            background: var(--panel);
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, .06);
        }

        .login-card h1 {
            margin: 0 0 4px;
            font-size: 20px;
        }

        .login-card p {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 13px;
        }

        .login-card input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .login-card input:focus { border-color: var(--brand); }

        .login-card button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: var(--brand);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .login-card button:hover { background: #c2690a; }

        .login-card button:disabled { background: #ccc; cursor: not-allowed; }

        .err { color: #d93f3f; font-size: 13px; min-height: 18px; margin-top: 8px; }

        /* ---------- 聊天 ---------- */
        #chat { display: none; height: 100vh; flex-direction: column; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        header .title { font-weight: 600; font-size: 15px; }

        header .who { color: var(--muted); font-size: 13px; }

        header button {
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 13px;
            cursor: pointer;
            color: var(--muted);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .row { display: flex; }
        .row.user { justify-content: flex-end; }

        .bubble {
            max-width: 72%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user .bubble {
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 3px;
        }

        .bot .bubble {
            background: var(--bot-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 3px;
        }

        /* 每个回答下面带一行路由信息，演示时一眼能看出走了哪条路 */
        .meta {
            margin-top: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        /* 答案溯源：默认折叠，点开看依据来自哪份文档的哪一节、第几页 */
        .sources {
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
        }
        .sources summary {
            cursor: pointer;
            color: #a35a05;
            user-select: none;
            display: inline-block;
        }
        .sources summary:hover { text-decoration: underline; }
        .source {
            margin-top: 8px;
            padding: 8px 10px;
            border-left: 3px solid var(--brand-soft);
            background: #fafbfc;
            border-radius: 0 6px 6px 0;
        }
        .source-head { color: var(--text); font-weight: 500; margin-bottom: 2px; }
        .source-where { color: #a35a05; margin-bottom: 4px; }
        .source-snippet { color: var(--muted); line-height: 1.5; }

        .tag {
            display: inline-block;
            padding: 1px 7px;
            margin-right: 5px;
            border-radius: 4px;
            background: var(--brand-soft);
            color: #a35a05;
            font-size: 11px;
        }

        .typing { color: var(--muted); font-size: 13px; font-style: italic; }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 20px 10px;
        }

        .examples button {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 16px;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
        }

        .examples button:hover { border-color: var(--brand); color: var(--brand); }

        footer {
            display: flex;
            gap: 10px;
            padding: 12px 20px 18px;
            background: var(--panel);
            border-top: 1px solid var(--border);
        }

        footer input {
            flex: 1;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        footer input:focus { border-color: var(--brand); }

        footer button {
            padding: 0 22px;
            border: none;
            border-radius: 10px;
            background: var(--brand);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        footer button:disabled { background: #ccc; cursor: not-allowed; }
        /* 引用角标：点开能跳到原件那一页 */
        .cite {
            color: #2563eb;
            cursor: pointer;
            font-size: 0.75em;
            vertical-align: super;
            padding: 0 1px;
            user-select: none;
        }

        .cite:hover { text-decoration: underline; }

        /* 原件预览弹层 */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: none;
            z-index: 50;
            align-items: center;
            justify-content: center;
        }

        .modal.open { display: flex; }

        .modal-box {
            background: #fff;
            width: min(940px, 94vw);
            max-height: 92vh;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-title { font-weight: 600; }
        .modal-where { color: #6b7280; font-size: 13px; margin-top: 2px; }

        .modal-close {
            border: 0;
            background: transparent;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            color: #6b7280;
        }

        .modal-body {
            flex: 1;
            overflow: auto;
            padding: 12px 16px;
            background: #f9fafb;
            display: flex;
            justify-content: center;
        }

        .modal-body canvas { max-width: 100%; box-shadow: 0 1px 6px rgba(0, 0, 0, .15); background: #fff; }
        .modal-body img { max-width: 100%; }
        .modal-body .raw {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 13px;
            background: #fff;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            margin: 0;
        }

        .modal-body .placeholder { color: #6b7280; padding: 40px 0; text-align: center; }

        .modal-foot {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-top: 1px solid #e5e7eb;
            font-size: 14px;
        }

        .modal-foot button:disabled { opacity: .4; cursor: default; }
    </style>
</head>
<body>

<!-- ============ 登录 ============ -->
<div id="login">
    <div class="login-card">
        <h1>机械家 AI 助手</h1>
        <p>找设备 · 查出租求租 · 问平台规则 · 发布信息</p>
        <input id="username" placeholder="账号" autocomplete="username">
        <input id="password" type="password" placeholder="密码" autocomplete="current-password">
        <button id="loginBtn">登录</button>
        <div class="err" id="loginErr"></div>
    </div>
</div>

<!-- ============ 聊天 ============ -->
<div id="chat">
    <header>
        <div>
            <div class="title">机械家 AI 助手</div>
            <div class="who" id="who"></div>
        </div>
        <button id="logoutBtn">退出</button>
    </header>

    <div id="messages"></div>

    <div class="examples" id="examples">
        <button>有没有二手的挖掘机</button>
        <button>附近有挖掘机出租吗</button>
        <button>平台收多少手续费</button>
        <button>有二手的挖掘机吗，另外有没有挖掘机出租</button>
    </div>

    <footer>
        <input id="input" placeholder="说点什么…（回车发送）" autocomplete="off">
        <button id="sendBtn">发送</button>
    </footer>
</div>

<!-- 原件预览弹层。必须放在下方脚本**之前**：脚本解析到这里时就会去绑
     srcClose/srcPrev 这些按钮的事件，那时它们还不存在就会报 null。 -->
<div class="modal" id="srcModal">
    <div class="modal-box">
        <div class="modal-head">
            <div>
                <div class="modal-title" id="srcTitle"></div>
                <div class="modal-where" id="srcWhere"></div>
            </div>
            <button class="modal-close" id="srcClose" type="button">×</button>
        </div>
        <div class="modal-body" id="srcBody"></div>
        <div class="modal-foot">
            <button id="srcPrev" type="button">‹ 上一页</button>
            <span id="srcPage"></span>
            <button id="srcNext" type="button">下一页 ›</button>
            <span id="srcAdmin"></span>
        </div>
    </div>
</div>

<script>
    const state = {
        token: null,
        user: null,
        conversationId: null,
        sending: false
    };

    const $ = id => document.getElementById(id);

    // ---------- 登录 ----------
    async function login() {
        const username = $('username').value.trim();
        const password = $('password').value;
        if (!username || !password) {
            $('loginErr').textContent = '请填写账号和密码';
            return;
        }
        $('loginBtn').disabled = true;
        $('loginErr').textContent = '';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (!res.ok) {
                $('loginErr').textContent = data.message || '登录失败';
                return;
            }
            state.token = data.token;
            state.user = data.user;
            showChat();
        } catch (e) {
            $('loginErr').textContent = '连不上服务，确认应用已启动';
        } finally {
            $('loginBtn').disabled = false;
        }
    }

    function showChat() {
        $('login').style.display = 'none';
        $('chat').style.display = 'flex';
        $('who').textContent = state.user.username +
            '（' + (state.user.roles || []).join('/') + '）';
        addBotMessage('你好，我是机械家的智能助手。可以帮你找设备、查出租求租、问平台规则。\n' +
            '试试下面的问题，或者直接说你想干什么。');
        $('input').focus();
    }

    // ---------- 发消息 ----------
    async function send(text) {
        if (state.sending) return;
        const message = (text || $('input').value).trim();
        if (!message) return;

        state.sending = true;
        $('sendBtn').disabled = true;
        $('input').value = '';
        addUserMessage(message);

        const typing = addTyping();

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + state.token
                },
                body: JSON.stringify({
                    conversationId: state.conversationId,
                    message: message
                })
            });

            typing.remove();

            if (res.status === 401) {
                addBotMessage('登录已过期，请重新登录。');
                logout();
                return;
            }

            const data = await res.json();
            if (!res.ok) {
                addBotMessage('出错了：' + (data.message || res.status));
                return;
            }

            // 记下会话 id，后续追问才连得上上下文
            state.conversationId = data.conversationId;
            addBotMessage(data.answer, data);

        } catch (e) {
            typing.remove();
            addBotMessage('连不上服务：' + e.message);
        } finally {
            state.sending = false;
            $('sendBtn').disabled = false;
            $('input').focus();
        }
    }

    // ---------- 渲染 ----------
    function addUserMessage(text) {
        const row = document.createElement('div');
        row.className = 'row user';
        const b = document.createElement('div');
        b.className = 'bubble';
        b.textContent = text;
        row.appendChild(b);
        $('messages').appendChild(row);
        scrollDown();
    }

    function addBotMessage(text, meta) {
        const row = document.createElement('div');
        row.className = 'row bot';

        const wrap = document.createElement('div');

        const b = document.createElement('div');
        b.className = 'bubble';
        // ⚠️ 顺序不能反：**先转义、再替换角标**。
        // 知识库内容是**用户上传的文档**，里面完全可能有尖括号甚至 script 标签；
        // 先替换再转义，就等于把上传内容当 HTML 执行了。
        if (meta && meta.sources && meta.sources.length) {
            b.innerHTML = renderCitations(esc(text), meta.sources);
            b.querySelectorAll('.cite').forEach(function (el) {
                el.addEventListener('click', function () {
                    openSource(meta.sources[parseInt(el.dataset.i, 10) - 1]);
                });
            });
        } else {
            b.textContent = text;
        }
        wrap.appendChild(b);

        // 把路由结果显示出来：演示时能直观看到"这句话被交给了谁"
        if (meta) {
            const m = document.createElement('div');
            m.className = 'meta';
            let html = '';
            if (meta.intent) html += '<span class="tag">' + meta.intent + '</span>';
            if (meta.agentKey) html += '<span class="tag">' + meta.agentKey + '</span>';
            if (meta.stage) html += '<span class="tag">' + meta.stage + '</span>';
            m.innerHTML = html;
            wrap.appendChild(m);

            // 溯源：把答案依据列出来。默认折叠，点开能看到"这条答案是从哪份文档
            // 的哪一节、第几页来的"——客服场景里这是建立信任的关键。
            if (meta.sources && meta.sources.length) {
                const box = document.createElement('details');
                box.className = 'sources';
                let html2 = '<summary>依据（' + meta.sources.length + '）</summary>';
                meta.sources.forEach(function (s, i) {
                    const where = [s.sectionPath, s.pageNo ? ('第 ' + s.pageNo + ' 页') : null]
                        .filter(Boolean).join(' · ');
                    html2 += '<div class="source">'
                        + '<div class="source-head">[' + (i + 1) + '] ' + esc(s.title || '(无标题)') + '</div>'
                        + (where ? '<div class="source-where">' + esc(where) + '</div>' : '')
                        + '<div class="source-snippet">' + esc(s.snippet || '') + '</div>'
                        + '</div>';
                });
                box.innerHTML = html2;
                wrap.appendChild(box);
            }
        }

        row.appendChild(wrap);
        $('messages').appendChild(row);
        scrollDown();
    }

    /** 转义，避免资料里的尖括号把页面结构撑坏。 */
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function addTyping() {
        const row = document.createElement('div');
        row.className = 'row bot';
        const b = document.createElement('div');
        b.className = 'bubble typing';
        b.textContent = '正在处理…';
        row.appendChild(b);
        $('messages').appendChild(row);
        scrollDown();
        return row;
    }

    function scrollDown() {
        const box = $('messages');
        box.scrollTop = box.scrollHeight;
    }

    function logout() {
        fetch('/api/auth/logout', {
            method: 'POST',
            headers: {'Authorization': 'Bearer ' + state.token}
        }).catch(() => {});
        state.token = null;
        state.user = null;
        state.conversationId = null;
        $('messages').innerHTML = '';
        $('chat').style.display = 'none';
        $('login').style.display = 'flex';
        $('password').value = '';
    }

    // ---------- 事件 ----------
    $('loginBtn').onclick = login;
    $('password').onkeydown = e => { if (e.key === 'Enter') login(); };
    $('sendBtn').onclick = () => send();
    $('input').onkeydown = e => { if (e.key === 'Enter') send(); };
    $('logoutBtn').onclick = logout;

    $('examples').onclick = e => {
        if (e.target.tagName === 'BUTTON') send(e.target.textContent);
    };

    $('username').focus();
    // ---------- 引用角标与原件预览 ----------

    /**
     * 把答案正文里的引用编号做成可点角标。
     *
     * ⚠️ 传进来的必须是**已经转义过**的文本。顺序不能反：知识库内容是
     * 用户上传的文档，里面完全可能有尖括号甚至 script 标签。
     */
    function renderCitations(escaped, sources) {
        if (!sources || !sources.length) return escaped;
        return escaped.replace(/\[(\d{1,3})\]/g, function (m, n) {
            const i = parseInt(n, 10);
            // 越界编号留成纯文本。宁可少一个角标，也不能让用户点开一份**错的原件**——
            // 那比没有链接更伤信任。（这条规则的服务端权威表述在 CitationSanitizer.isValid）
            if (i < 1 || i > sources.length) return m;
            return '<sup class="cite" data-i="' + i + '">[' + i + ']</sup>';
        });
    }

    /** 当前登录账号是不是管理员。"下载原件"入口只对管理员显示。 */
    function isAdmin() {
        return !!(state.user && state.user.roles && state.user.roles.indexOf('ADMIN') >= 0);
    }

    // PDF 文档对象与当前页，翻页时复用（重新 getDocument 要重解析一遍）
    let pdfDoc = null;
    let pdfPage = 1;

    function closeModal() {
        $('srcModal').classList.remove('open');
        $('srcBody').innerHTML = '';
        pdfDoc = null;
    }

    function placeholder(text) {
        $('srcBody').innerHTML = '<div class="placeholder">' + esc(text) + '</div>';
    }

    /**
     * 打开某条依据的原件。
     *
     * 原件的取法：**用 fetch 带令牌拿字节，再喂给渲染器**——
     * 不能把接口 URL 直接塞进 iframe src（那样带不了 Authorization 头，会被 401），
     * 也不会给用户一个可以另存、可以转发的直链。
     */
    async function openSource(s) {
        if (!s) return;

        $('srcModal').classList.add('open');
        $('srcTitle').textContent = s.title || '(无标题)';
        const where = [s.sectionPath, s.pageNo ? ('第 ' + s.pageNo + ' 页') : null]
            .filter(Boolean).join(' · ');
        $('srcWhere').textContent = where || '这条依据没有章节与页码信息';

        // "在管理台打开原件"只在 ADMIN 登录时出现
        $('srcAdmin').innerHTML = isAdmin()
            ? '<a href="/api/admin/knowledge/docs/' + s.docId + '/file" style="margin-left:auto">下载原件（管理台）</a>'
            : '';

        pdfDoc = null;
        pdfPage = s.pageNo || 1;
        setPager(0, 0);

        if (!s.previewable) {
            placeholder('这份原件没有可预览的版本（格式不支持，或 Office 转换未成功）。'
                + (isAdmin() ? '可以用下方"下载原件"取原件。' : ''));
            return;
        }

        placeholder('正在取原件…');
        try {
            const res = await fetch('/api/knowledge/files/' + s.docId + '/preview', {
                headers: { 'Authorization': 'Bearer ' + state.token }
            });
            if (!res.ok) {
                placeholder('取原件失败：HTTP ' + res.status);
                return;
            }
            const blob = await res.blob();
            const type = (res.headers.get('Content-Type') || blob.type || '').split(';')[0];

            if (type === 'application/pdf') {
                await renderPdf(blob, pdfPage);
            } else if (type.indexOf('image/') === 0) {
                renderImage(blob);
            } else {
                renderText(blob);
            }
        } catch (e) {
            placeholder('取原件出错：' + e.message);
        }
    }

    function setPager(current, total) {
        $('srcPage').textContent = total ? ('第 ' + current + ' 页 / 共 ' + total + ' 页') : '';
        $('srcPrev').disabled = !total || current <= 1;
        $('srcNext').disabled = !total || current >= total;
    }

    async function renderPdf(blob, pageNo) {
        // 动态 import：这两个文件是 ES module，不想为此把整个页面改成 module
        const pdfjsLib = await import('/vendor/pdfjs/pdf.min.mjs');
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs';

        pdfDoc = await pdfjsLib.getDocument({ data: await blob.arrayBuffer() }).promise;
        await drawPage(Math.min(Math.max(1, pageNo), pdfDoc.numPages));
    }

    async function drawPage(pageNo) {
        if (!pdfDoc) return;
        const page = await pdfDoc.getPage(pageNo);
        const viewport = page.getViewport({ scale: 1.4 });

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        $('srcBody').innerHTML = '';
        $('srcBody').appendChild(canvas);

        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        pdfPage = pageNo;
        setPager(pageNo, pdfDoc.numPages);
    }

    function renderImage(blob) {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(blob);
        img.onload = function () { URL.revokeObjectURL(img.src); };
        $('srcBody').innerHTML = '';
        $('srcBody').appendChild(img);
        setPager(0, 0);
    }

    async function renderText(blob) {
        const pre = document.createElement('pre');
        pre.className = 'raw';
        pre.textContent = await blob.text();
        $('srcBody').innerHTML = '';
        $('srcBody').appendChild(pre);
        setPager(0, 0);
    }

    $('srcClose').addEventListener('click', closeModal);
    $('srcPrev').addEventListener('click', function () { if (pdfPage > 1) drawPage(pdfPage - 1); });
    $('srcNext').addEventListener('click', function () {
        if (pdfDoc && pdfPage < pdfDoc.numPages) drawPage(pdfPage + 1);
    });
    $('srcModal').addEventListener('click', function (e) {
        if (e.target === $('srcModal')) closeModal();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
    });
</script>
</body>
</html>
