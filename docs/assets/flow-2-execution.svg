<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1080" width="1450" height="1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6e7781"/></marker></defs><rect width="1450" height="1080" fill="#ffffff"/><text x="40" y="42" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#1f2328">分派之后：四条互斥的路</text><text x="40" y="66" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#6e7781">每次只走其中一条；跑完都汇到同一个地方收尾</text><rect x="593.0" y="96" width="264" height="60" rx="7" fill="#fafbfc" stroke="#b9c2cc" stroke-width="1.2"/><text x="725.0" y="120.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">⑧ 分派</text><text x="725.0" y="141.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13.0" font-weight="400" fill="#444c56" text-anchor="middle">短路 / 知识类 / 跨域 / 单域</text><rect x="40" y="196" width="232" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><path d="M47,196 L47,262" stroke="#9aa4ae" stroke-width="3" stroke-linecap="round"/><text x="156.0" y="222" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">短路</text><text x="156.0" y="242" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#6e7781" text-anchor="middle">不调模型，回一句话</text><rect x="40" y="284" width="232" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="156.0" y="303.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">直接返回</text><text x="156.0" y="322.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">(转人工 / 投诉 / 命令 /</text><text x="156.0" y="341.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">身份拦截都走这条)</text><polyline points="156.0,156 156.0,196" fill="none" stroke="#d0d7de" stroke-width="1.3"/><rect x="316" y="196" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><path d="M323,196 L323,262" stroke="#4f8f4f" stroke-width="3" stroke-linecap="round"/><text x="460.0" y="222" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">⑨ 知识线作答</text><text x="460.0" y="242" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#6e7781" text-anchor="middle">不是 Agent，是写死的流水线</text><rect x="316" y="284" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="460.0" y="312.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">① 混合召回 20 条</text><text x="460.0" y="331.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">关键词 BM25 + 语义 KNN</text><rect x="316" y="364" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="460.0" y="392.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">② 精排打分</text><text x="460.0" y="411.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">交叉编码器</text><rect x="316" y="444" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="460.0" y="472.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">③ 证据闸</text><text x="460.0" y="491.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">分够不够回答？</text><rect x="316" y="524" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="460.0" y="552.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">④ 回填本体</text><text x="460.0" y="571.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">摘要 → 完整表格</text><rect x="316" y="604" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="460.0" y="632.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">⑤ 生成答案</text><text x="460.0" y="651.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">标 [1][2] 角标</text><rect x="316" y="684" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="460.0" y="712.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">⑥ 自评</text><text x="460.0" y="731.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">本地小模型核对</text><polyline points="460.0,156 460.0,196" fill="none" stroke="#d0d7de" stroke-width="1.3"/><rect x="648" y="196" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><path d="M655,196 L655,262" stroke="#4a7fc1" stroke-width="3" stroke-linecap="round"/><text x="792.0" y="222" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">⑩ 跨域作答</text><text x="792.0" y="242" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#6e7781" text-anchor="middle">真并行，三个域同时跑</text><rect x="648" y="284" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="792.0" y="312.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">① 确定跑哪几个域</text><text x="792.0" y="331.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">最多 3 个</text><rect x="648" y="364" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="792.0" y="392.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">② 三个域同时跑</text><text x="792.0" y="411.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">设备 / 租赁 / 知识</text><rect x="648" y="444" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="792.0" y="472.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">③ 汇总</text><text x="792.0" y="491.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">合成一条回答</text><polyline points="792.0,156 792.0,196" fill="none" stroke="#d0d7de" stroke-width="1.3"/><rect x="980" y="196" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><path d="M987,196 L987,262" stroke="#8a63b0" stroke-width="3" stroke-linecap="round"/><text x="1124.0" y="222" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">⑪ 单域作答</text><text x="1124.0" y="242" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#6e7781" text-anchor="middle">这才是 Agent（ReAct 循环）</text><rect x="980" y="284" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="1124.0" y="312.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">① 取工具白名单</text><text x="1124.0" y="331.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">角色决定看得到哪些</text><rect x="980" y="364" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="1124.0" y="402.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">② 问模型：要调工具吗？</text><rect x="980" y="444" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="1124.0" y="472.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">③ 执行工具</text><text x="1124.0" y="491.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">查业务库</text><rect x="980" y="524" width="288" height="66" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="1124.0" y="552.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">④ 出答案</text><text x="1124.0" y="571.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="400" fill="#444c56" text-anchor="middle">模型说够了就收敛</text><polyline points="1124.0,156 1124.0,196" fill="none" stroke="#d0d7de" stroke-width="1.3"/><polyline points="1268,477.0 1282,477.0 1282,397.0 1268,397.0" fill="none" stroke="#6e7781" stroke-width="1.3" marker-end="url(#arrow)"/><text x="1287" y="441.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10.5" fill="#6e7781" text-anchor="start">结果丢回</text><rect x="405.0" y="818" width="640" height="84" rx="9" fill="#fafbfc" stroke="#e1e5ea" stroke-width="1.2"/><text x="725.0" y="852" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">汇聚：所有路径都回到这里</text><text x="725.0" y="876" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#444c56" text-anchor="middle">存本轮用户消息 → 认不出意图就记数据飞轮 → 存助手回复 → 返回前端</text><polyline points="156.0,350 156.0,802 725.0,802 725.0,818" fill="none" stroke="#d0d7de" stroke-width="1.3"/><polyline points="460.0,750 460.0,802 725.0,802 725.0,818" fill="none" stroke="#d0d7de" stroke-width="1.3"/><polyline points="792.0,510 792.0,802 725.0,802 725.0,818" fill="none" stroke="#d0d7de" stroke-width="1.3"/><polyline points="1124.0,590 1124.0,802 725.0,802 725.0,818" fill="none" stroke="#d0d7de" stroke-width="1.3"/><rect x="673.0" y="928" width="104" height="42" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="725.0" y="953.9" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">结束</text><polyline points="725.0,902 725.0,928" fill="none" stroke="#d0d7de" stroke-width="1.3"/></svg>