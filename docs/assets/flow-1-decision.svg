<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1010" width="1230" height="1010"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6e7781"/></marker></defs><rect width="1230" height="1010" fill="#ffffff"/><text x="40" y="42" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#1f2328">一条消息从进来到分派</text><text x="40" y="66" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#6e7781">①~⑦ 任何一步提前定案，都不继续往下判 —— 统一产出决策汇到 ⑧</text><rect x="60" y="96" width="220" height="44" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="170.0" y="112.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">起点</text><text x="170.0" y="133.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13.0" font-weight="400" fill="#444c56" text-anchor="middle">用户发一句话</text><rect x="60" y="182" width="220" height="56" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="170.0" y="204.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">① 身份检查</text><text x="170.0" y="225.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13.0" font-weight="400" fill="#444c56" text-anchor="middle">查 MySQL 的 ai_user 表</text><rect x="60" y="268" width="220" height="56" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="170.0" y="290.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">② 系统命令</text><text x="170.0" y="311.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13.0" font-weight="400" fill="#444c56" text-anchor="middle">是不是 /reset 这类指令</text><rect x="60" y="398" width="220" height="56" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="170.0" y="420.2" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">③ 开场扫描</text><text x="170.0" y="442.2" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13.0" font-weight="400" fill="#444c56" text-anchor="middle">读粘性 + 关键词 + 跨域判定</text><rect x="60" y="484" width="220" height="56" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="170.0" y="506.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">⑤ 指代消解</text><text x="170.0" y="527.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13.0" font-weight="400" fill="#444c56" text-anchor="middle">把「那台」补成完整问题</text><rect x="60" y="570" width="220" height="56" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="170.0" y="592.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">⑥ 意图分类</text><text x="170.0" y="613.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13.0" font-weight="400" fill="#444c56" text-anchor="middle">关键词 → 小模型 → 云端</text><rect x="60" y="656" width="220" height="56" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="170.0" y="678.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">⑦ 匹配助手</text><text x="170.0" y="699.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13.0" font-weight="400" fill="#444c56" text-anchor="middle">注册表 + 角色白名单</text><rect x="350" y="398" width="214" height="56" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="457.0" y="420.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">④ 关键词定案</text><text x="457.0" y="441.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13.0" font-weight="400" fill="#444c56" text-anchor="middle">和粘性里的意图比对</text><rect x="38.0" y="776" width="264" height="60" rx="7" fill="#fafbfc" stroke="#b9c2cc" stroke-width="1.2"/><text x="170.0" y="800.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">⑧ 分派</text><text x="170.0" y="821.7" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13.0" font-weight="400" fill="#444c56" text-anchor="middle">推 SSE + 决定走哪条执行路</text><rect x="610" y="128" width="530" height="250" rx="9" fill="#fafbfc" stroke="#e1e5ea" stroke-width="1.2"/><text x="636" y="160" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1f2328">提前定案的六种情况</text><line x1="636" y1="172" x2="1114" y2="172" stroke="#e6eaee" stroke-width="1"/><text x="636" y="200" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" >① 身份</text><text x="718" y="200" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#444c56">未登录 / 账号不存在 / 账号停用</text><text x="636" y="230" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" >② 命令</text><text x="718" y="230" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#444c56">命中 /reset → 清 Redis 粘性</text><text x="636" y="260" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" >③ 跨域</text><text x="718" y="260" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#444c56">一句话命中 ≥2 个业务域</text><text x="636" y="290" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" >④ 关键词</text><text x="718" y="290" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#444c56">能定案 → 直接用，或沿用粘性</text><text x="636" y="320" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" >③ 粘性</text><text x="718" y="320" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#444c56">含「那台 / 它」+ 有上一轮</text><text x="636" y="350" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" >⑥ 短路</text><text x="718" y="350" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#444c56">转人工 / 投诉 → 回固定话术</text><text x="636" y="362" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6e7781">以上都不继续往下判，统一汇到 ⑧</text><polyline points="170.0,140 170.0,182" fill="none" stroke="#d0d7de" stroke-width="1.3"/><polyline points="170.0,238 170.0,268" fill="none" stroke="#d0d7de" stroke-width="1.3"/><text x="196.0" y="257.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6e7781" text-anchor="start">通过</text><polyline points="170.0,324 170.0,398" fill="none" stroke="#d0d7de" stroke-width="1.3"/><text x="196.0" y="365.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6e7781" text-anchor="start">没命中</text><polyline points="170.0,454 170.0,484" fill="none" stroke="#d0d7de" stroke-width="1.3"/><text x="196.0" y="473.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6e7781" text-anchor="start">都不成立</text><polyline points="170.0,540 170.0,570" fill="none" stroke="#d0d7de" stroke-width="1.3"/><polyline points="170.0,626 170.0,656" fill="none" stroke="#d0d7de" stroke-width="1.3"/><text x="196.0" y="645.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6e7781" text-anchor="start">正常</text><polyline points="170.0,712 170.0,776" fill="none" stroke="#d0d7de" stroke-width="1.3"/><polyline points="280,424 350,424" fill="none" stroke="#d0d7de" stroke-width="1.3"/><text x="315.0" y="416" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" fill="#6e7781" text-anchor="middle">关键词定案</text><polyline points="564,426.0 610,426.0" fill="none" stroke="#d0d7de" stroke-width="1.3" stroke-dasharray="4 4"/><polyline points="280,210.0 610,210.0" fill="none" stroke="#d0d7de" stroke-width="1.3" stroke-dasharray="4 4"/><polyline points="280,296.0 610,296.0" fill="none" stroke="#d0d7de" stroke-width="1.3" stroke-dasharray="4 4"/><polyline points="280,598.0 610,598.0" fill="none" stroke="#d0d7de" stroke-width="1.3" stroke-dasharray="4 4"/><polyline points="875.0,378 875.0,806.0 302.0,806.0" fill="none" stroke="#d0d7de" stroke-width="1.3"/></svg>