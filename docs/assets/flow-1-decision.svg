<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1010" width="1180" height="1010"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker></defs><text x="40" y="40" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#1f2328">① 判定段：一句话进来，先过七道判定，全部汇到 ⑧ 分派</text><rect x="60" y="80" width="200" height="44" rx="8" fill="#f0f0f0" stroke="#666666" stroke-width="1.6"/><text x="160.0" y="97.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">起 点</text><text x="160.0" y="116.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">用户发一句话</text><rect x="60" y="164" width="200" height="52" rx="8" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="160.0" y="185.2" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">① 身份检查</text><text x="160.0" y="204.2" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">查 MySQL 的 ai_user 表</text><rect x="60" y="248" width="200" height="52" rx="8" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="160.0" y="269.2" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">② 系统命令</text><text x="160.0" y="288.2" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">是不是 /reset 这类指令</text><rect x="60" y="372" width="200" height="52" rx="8" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="160.0" y="383.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">③ 开场扫描</text><text x="160.0" y="402.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">读粘性 + 关键词 + 跨域判定</text><text x="160.0" y="421.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">都是零成本，不叫模型</text><rect x="60" y="456" width="200" height="52" rx="8" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="160.0" y="467.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">⑤ 指代消解</text><text x="160.0" y="486.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">把「那台」补成完整问题</text><text x="160.0" y="505.5" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">⚠️ 要叫一次本地小模型</text><rect x="60" y="540" width="200" height="52" rx="8" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="160.0" y="561.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">⑥ 意图分类</text><text x="160.0" y="580.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">关键词 → 本地小模型 → 云端</text><rect x="60" y="624" width="200" height="52" rx="8" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="160.0" y="645.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">⑦ 匹配助手</text><text x="160.0" y="664.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">能力注册表 + 角色白名单</text><rect x="330" y="372" width="210" height="52" rx="8" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="435.0" y="393.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">④ 关键词定案</text><text x="435.0" y="412.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">和粘性里的意图比对</text><rect x="30.0" y="738" width="260" height="62" rx="8" fill="#ffe8cc" stroke="#d4841a" stroke-width="1.6"/><text x="160.0" y="764.4" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">⑧ 分 派  ◆</text><text x="160.0" y="783.4" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="400" fill="#57606a" text-anchor="middle">推 SSE + 决定走哪条执行路</text><rect x="600" y="150" width="540" height="260" rx="10" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4"/><text x="624" y="184" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#1f2328">提前定案的六种情况</text><text x="624" y="216" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#57606a">① 未登录 / 账号不存在 / 账号停用</text><text x="624" y="243" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#57606a">② 命中 /reset → 清 Redis 粘性 + 回一句</text><text x="624" y="270" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#57606a">③ 一句话命中 ≥2 个业务域 → 走跨域</text><text x="624" y="297" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#57606a">④ 关键词能定案 → 直接用，或沿用粘性</text><text x="624" y="324" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#57606a">③ 含「那台 / 它」+ 有上一轮 → 沿用上轮助手</text><text x="624" y="351" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#57606a">⑥ 转人工 / 投诉 → 回固定话术</text><text x="624" y="384" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8b949e">以上都产出决策，不继续往下判 —— 统一汇到 ⑧</text><polyline points="160.0,124 160.0,164" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="160.0,216 160.0,248" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="236.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#57606a" text-anchor="start">通过</text><polyline points="160.0,300 160.0,372" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="340.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#57606a" text-anchor="start">没命中</text><polyline points="160.0,424 160.0,456" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="444.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#57606a" text-anchor="start">都不成立</text><polyline points="160.0,508 160.0,540" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="160.0,592 160.0,624" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="612.0" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#57606a" text-anchor="start">正常</text><polyline points="160.0,676 160.0,738" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="260,398 330,398" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="295.0" y="390" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#57606a" text-anchor="middle">关键词定案</text><polyline points="540,398.0 600,398.0" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="260,190.0 600,190.0" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="260,274.0 600,274.0" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="260,398.0 600,398.0" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="260,566.0 600,566.0" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="870.0,410 870.0,769.0 290.0,769.0" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/></svg>